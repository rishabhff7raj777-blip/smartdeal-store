<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartDeal Store</title>
<style>body{font-family:Arial;margin:0;background:#f6f6f8}.top{position:sticky;top:0;background:#fff;padding:13px;box-shadow:0 2px 8px #ddd;z-index:3}.brand{font-size:23px;font-weight:900}.brand span{color:#d81b60}.search{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:#ddd}.card{background:#fff;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:contain}.info{padding:10px}.price{font-size:20px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px}.detail{display:none;position:fixed;inset:0;background:#fff;z-index:10;overflow:auto}.back{padding:14px;border:0;background:#fff;font-size:20px}.mainimg{width:100%;height:370px;object-fit:contain}.thumbs{display:flex;gap:7px;padding:8px}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px}.body{padding:15px}.buy{width:100%;padding:15px;background:#d81b60;color:#fff;border:0;border-radius:9px;font-size:17px;font-weight:800}.form{display:none;position:fixed;inset:0;background:#f6f6f8;z-index:20;padding:15px;overflow:auto}.form input,.form textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px}.empty{text-align:center;padding:60px;color:#777}</style></head><body>
<div class="top"><div class="brand">Smart<span>Deal</span> Store</div><input id="q" class="search" placeholder="🔍 Search products..." oninput="render()"></div>
<div id="grid" class="grid"></div>
<div id="detail" class="detail"><button class="back" onclick="closeD()">← Back</button><img id="mi" class="mainimg"><div id="thumbs" class="thumbs"></div><div class="body"><h1 id="dn"></h1><div id="dp" class="price"></div><p id="dd"></p><h3>Key Features</h3><p id="df"></p><h3>Delivery Information</h3><p id="dv"></p><button class="buy" onclick="orderForm()">BUY NOW</button></div></div>
<div id="form" class="form"><button class="back" onclick="closeF()">← Back</button><h2>Delivery Details</h2><p id="op"></p><input id="cn" placeholder="Customer Name *"><input id="ph" placeholder="Mobile Number *"><input id="house" placeholder="House / Building *"><input id="area" placeholder="Road / Area / Colony *"><input id="pin" placeholder="Pincode *"><input id="city" placeholder="City *"><input id="state" placeholder="State *"><p><b>Payment: Cash on Delivery</b></p><button class="buy" onclick="place()">PLACE ORDER ON WHATSAPP</button></div>
<script>
let ps=JSON.parse(localStorage.getItem('SD_PRODUCTS')||'[]'),cur=null;
function render(){let q=$('q').value.toLowerCase(),a=ps.filter(x=>(x.n+' '+x.d).toLowerCase().includes(q));$('grid').innerHTML=a.length?a.map(x=>`<div class="card" onclick="openD(${x.id})"><img src="${x.im[0]}"><div class="info"><b>${x.n}</b><div class="price">₹${x.p} ${x.m?`<span class="old">₹${x.m}</span>`:''}</div></div></div>`).join(''):'<div class="empty">No products found</div>'}
function openD(id){cur=ps.find(x=>x.id===id);$('detail').style.display='block';$('dn').textContent=cur.n;$('dp').textContent='₹'+cur.p;$('dd').textContent=cur.d;$('df').textContent=cur.f;$('dv').textContent=cur.delv;$('mi').src=cur.im[0];$('thumbs').innerHTML=cur.im.map(x=>`<img src="${x}" onclick="$('mi').src='${x}'">`).join('')}
function closeD(){$('detail').style.display='none'}function orderForm(){$('detail').style.display='none';$('form').style.display='block';$('op').textContent=cur.n+' — ₹'+cur.p}function closeF(){$('form').style.display='none'}
function place(){let vals=['cn','ph','house','area','pin','city','state'].map(x=>$(x).value.trim());if(vals.some(x=>!x)){alert('Please fill all details');return}let msg=`NEW ORDER - SmartDeal Store\nProduct: ${cur.n}\nPrice: ₹${cur.p}\nName: ${vals[0]}\nMobile: ${vals[1]}\nAddress: ${vals[2]}, ${vals[3]}, ${vals[5]}, ${vals[6]} - ${vals[4]}\nPayment: Cash on Delivery`;location.href='https://wa.me/9779703618936?text='+encodeURIComponent(msg)}
function $(x){return document.getElementById(x)}render();
</script></body></html>
